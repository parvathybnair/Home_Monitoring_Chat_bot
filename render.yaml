services:
  - type: web
    name: home-monitor-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: API_BASE_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
      - key: MODEL
        value: google/gemma-4-31b-it
      - key: TEMPERATURE
        value: "1.00"
      - key: MAX_TOKENS
        value: "256"
      - key: PYTHON_VERSION
        value: "3.11.0"
